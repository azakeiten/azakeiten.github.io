  <script>
    (function () {
      var box = document.querySelector('[data-sitemap]');
      var pages = window.AZAKEI_PAGES || [], spots = window.AZAKEI_SPOTS || [];
      if (!box || !pages.length) return;
      var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
      var groups = [];
      pages.forEach(function (p) { var g = groups.find(function (x) { return x.name === p.group; }); if (!g) groups.push(g = { name: p.group, pages: [] }); g.pages.push(p); });
      var extra = { name: 'その他', pages: [
        { href: 'mypage.html', ja: 'わたしの記録', desc: 'クイズの自己ベストやバッジを、1 ページで。' },
        { href: 'en.html', ja: 'English', desc: 'AZAKEI in English.' },
        { href: 'policy.html', ja: 'サイトポリシー', desc: '著作権・リンク・内容の扱い・写真の方針。' },
        { href: 'privacy.html', ja: 'プライバシーポリシー', desc: '集める情報と、その使い方。' }
      ] };
      groups.push(extra);
      var used = {};
      box.innerHTML = groups.map(function (g) {
        return '<div class="smap-group"><h2 class="smap-h">' + esc(g.name) + '</h2><ul>' + g.pages.map(function (p) {
          var kids = spots.filter(function (s) { return s.href.indexOf(p.href + '#') === 0 && !used[s.href]; });
          kids.forEach(function (s) { used[s.href] = 1; });
          return '<li><a class="smap-page" href="' + p.href + '"><b>' + esc(p.ja) + '</b>' + (p.desc ? '<small>' + esc(p.desc) + '</small>' : '') + '</a>'
            + (kids.length ? '<ul class="smap-kids">' + kids.map(function (s) { return '<li><a href="' + s.href + '">' + esc(s.ja) + '</a></li>'; }).join('') + '</ul>' : '') + '</li>';
        }).join('') + '</ul></div>';
      }).join('');
    })();
  </script>
