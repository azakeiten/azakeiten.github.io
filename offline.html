    @media (prefers-color-scheme: dark) { :root { --bg: #0f0e0c; --ink: #ece6da; --muted: rgba(236, 230, 218, 0.7); --gold: #d6b97f; --line: rgba(236, 230, 218, 0.14); } }

    a { color: var(--ink); text-decoration: none; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); }
