<body>

  <header class="page-hero" data-bg="CONTACT">
    <div class="container">
      <p class="breadcrumb"><a href="index.html">AZAKEI</a> / お問い合わせ</p>
      <p class="section-label">Contact</p>
      <h1 class="section-title"><span class="keep-phrase">お問い合わせ</span><span class="keep-phrase"><em>フォーム</em></span></h1>
      <p class="page-hero-lead">取材・協賛・コラボレーションのご相談、展示へのご質問など、お気軽にご連絡ください。</p>
    </div>
  </header>

  <section class="about tight">
    <div class="container">
      <div class="form-wrap">
        <div class="form-aside reveal">
          <p class="section-label">Before you write</p>
          <p>いただいた内容は、AZAKEI のメンバーが確認します。学校生活の合間に対応しているため、お返事まで数日いただく場合があります。</p>
          <p>協賛・ご協力については <a href="sponsor.html" style="color: var(--color-accent-deep); text-decoration: underline;">協賛のご案内</a> もあわせてご覧ください。</p>
          <p>Instagram の DM でも受け付けています。</p>
          <a class="dm-card" href="https://www.instagram.com/azakei_vlog/" target="_blank" rel="noopener">
            <span class="dm-label">Instagram DM</span>
            <span class="dm-handle">@azakei_vlog</span>
            <span class="dm-desc">お問い合わせはこちらのアカウントへ</span>
            <svg width="18" height="14" aria-hidden="true"><path d="M1 7h16M11 1l6 6-6 6" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
          </a>
        </div>

        <form class="contact-form reveal" id="contactForm" novalidate>
          <div>
            <span class="purpose-label">ご用件を選んでください</span>
            <div class="purpose" role="group" aria-label="ご用件">
              <button type="button" data-type="general" aria-pressed="true"><svg class="pp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/><path d="M9 10h6"/></svg><b>展示・活動について</b><small>文化祭や活動への質問</small></button>
              <button type="button" data-type="sponsor" aria-pressed="false"><svg class="pp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><b>協賛・ご協力</b><small>ご支援・登壇・メンタリング</small></button>
              <button type="button" data-type="media" aria-pressed="false"><svg class="pp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg><b>取材</b><small>メディア・学校新聞など</small></button>
              <button type="button" data-type="collab" aria-pressed="false"><svg class="pp-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg><b>コラボレーション</b><small>共同イベント・企画</small></button>
              <button type="button" data-type="other" aria-pressed="false" class="pp-wide"><svg class="pp-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></svg><b>その他</b><small>上にあてはまらないこと</small></button>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="name">お名前<span class="req">必須</span></label>
              <input id="name" name="name" type="text" autocomplete="name" required />
            </div>
            <div class="field">
              <label for="org">ご所属</label>
              <input id="org" name="org" type="text" autocomplete="organization" placeholder="会社名・学校名など" />
            </div>
          </div>
          <div class="field">
            <label for="email">メールアドレス<span class="req">必須</span></label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field field-type" hidden>
            <label for="type">お問い合わせの種類</label>
            <select id="type" name="type">
              <option value="general">展示・活動について</option>
              <option value="sponsor">協賛・ご協力</option>
              <option value="media">取材</option>
              <option value="collab">コラボレーション</option>
              <option value="other">その他</option>
            </select>
          </div>
          <div class="field">
            <label for="message">お問い合わせ内容<span class="req">必須</span></label>
            <textarea id="message" name="message" required maxlength="2000"></textarea>
            <span class="count" aria-live="off"><span id="msgCount">0</span> / 2000</span>
          </div>
          <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <div class="form-progress" aria-hidden="true"><span class="fp-bar"><i></i></span><span class="fp-text">必須 <b>0</b> / 3</span></div>
          <button type="submit" class="btn-primary">送信する</button>
          <p id="formStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="content.js?v=20261004w"></script>
  <script src="layout.js?v=20261004w"></script>
  <script src="brand.js?v=20261004w"></script>
  <script src="render.js?v=20261004w"></script>
  <script src="nav.js?v=20261004w"></script>
  <script src="reveal.js?v=20261004w"></script>
  <script src="site.js?v=20261004w"></script>
  <script>
    // ?type=sponsor などで種類を初期選択 & 必須チェック
    (function () {
      var form = document.getElementById('contactForm');
      var t = new URLSearchParams(location.search).get('type');
      if (t && form.type.querySelector('option[value="' + t + '"]')) form.type.value = t;
      // 協賛ページの「この内容で相談する」から来たら、本文の 1 行目に項目名を入れておく
      var topic = (new URLSearchParams(location.search).get('topic') || '').slice(0, 40);
      if (topic && !form.message.value) {
        form.message.value = '【' + topic + '】について\n';
        document.getElementById('msgCount').textContent = form.message.value.length;
      }

      // ご用件ボタン ⇔ 種類のセレクトを同期
      var btns = form.querySelectorAll('.purpose button');
      // ご用件ごとに、本文の書き方のヒントを変える
      var HINT = {
        general: '例）文化祭の展示について質問があります。〜',
        sponsor: 'ご支援の内容（協賛金・物品・登壇・メンタリングなど）や、ご希望の時期をお書きください。',
        media: '媒体名・取材の内容・ご希望の日程をお書きください。',
        collab: '企画の内容・ご希望の時期・規模などをお書きください。',
        other: 'ご自由にお書きください。'
      };
      function sync() {
        btns.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.type === form.type.value ? 'true' : 'false'); });
        form.message.placeholder = HINT[form.type.value] || '';
      }
      btns.forEach(function (b) {
        b.addEventListener('click', function () { form.type.value = b.dataset.type; sync(); form.name.focus(); });
      });
      form.type.addEventListener('change', sync);
      sync();

      // 文字数カウンター
      var msg = form.message, count = document.getElementById('msgCount');
      msg.addEventListener('input', function () { count.textContent = msg.value.length; });

      // 必須項目の進みぐあい（お名前・メール・内容）
      var req = [form.name, form.email, form.message];
      var fp = form.querySelector('.form-progress');
      function progress() {
        var n = req.filter(function (el) { return el.value.trim() && el.checkValidity(); }).length;
        fp.querySelector('b').textContent = n;
        fp.querySelector('i').style.width = (n / req.length * 100) + '%';
        fp.classList.toggle('is-done', n === req.length);
      }
      req.forEach(function (el) { el.addEventListener('input', progress); });
      form.addEventListener('reset', function () { setTimeout(progress, 0); });
      progress();
      form.addEventListener('submit', function (e) {
        if (!form.checkValidity()) {
          e.stopImmediatePropagation();
          e.preventDefault();
          form.reportValidity();
        }
      }, true);
    })();
  </script>
</body>
</html>
